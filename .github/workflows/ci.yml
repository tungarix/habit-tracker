name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # windows-latest: tray_manager/window_manager'ın native C++ eklentileri
    # var, ubuntu üzerinde bunlar derlenip test edilmeden "geçer" görünürdü.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bağımlılıkları kur
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Windows derlemesi (native eklentiler dahil derleniyor mu)
        run: flutter build windows --release
